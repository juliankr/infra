<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="canonical" href="/app">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kid Calendar">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/icon_16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon_32x32.png">
    <link rel="apple-touch-icon" href="/icon_256x256.png">
    <link rel="manifest" href="/manifest.json">
    <title>Kid Calendar</title>
    <style>
        :root {
            /* Color palette */
            --color-primary: #667eea;
            --color-primary-dark: #5a67d8;
            --color-primary-rgb: 102, 126, 234;
            --color-secondary: #764ba2;
            --color-secondary-dark: #6b46c1;
            
            /* Text colors */
            --color-text: #2d3748;
            --color-text-light: #4a5568;
            --color-text-muted: #718096;
            
            /* Gray scale */
            --color-gray-50: #f7fafc;
            --color-gray-100: #edf2f7;
            --color-gray-200: #e2e8f0;
            --color-gray-300: #cbd5e0;
            --color-gray-400: #a0aec0;
            --color-gray-500: #718096;
            --color-gray-600: #4a5568;
            --color-gray-700: #2d3748;
            --color-gray-800: #1a202c;
            --color-gray-900: #171923;
            
            /* Status colors */
            --color-danger: #e53e3e;
            --color-danger-dark: #c53030;
            --color-danger-light: #fed7d7;
            --color-danger-rgb: 229, 62, 62;
            --color-success: #38a169;
            --color-success-dark: #2f855a;
            --color-success-light: #c6f6d5;
            --color-warning: #d69e2e;
            --color-warning-dark: #b7791f;
            --color-warning-light: #faf089;
            --color-info: #3182ce;
            --color-info-dark: #2c5282;
            --color-info-light: #bee3f8;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
