apiVersion: batch/v1
kind: CronJob
metadata:
  name: certcheck
  namespace: default
spec:
  schedule: "0 16 * * *"  # Daily at 4pm
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: certchec
            image: debian:bookworm-slim
            resources:
              requests:
                memory: "128Mi"
              limits:
                memory: "128Mi"
            envFrom:
            - secretRef:
                name: signal
            command: ["/bin/bash"]
            args:
            - -c
            - |-
              set -e
              
              # Install required packages
              apt-get update && apt-get install -y openssl curl
              
              TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
              DOMAIN="nc.example.com"
              
              # Get certificate expiration date
              CERT_INFO=$(echo | openssl s_client -servername $DOMAIN -connect $DOMAIN:443 2>/dev/null | openssl x509 -noout -dates)
              EXPIRY_DATE=$(echo "$CERT_INFO" | grep notAfter | cut -d= -f2)
              
              # Convert expiry date to epoch
              EXPIRY_EPOCH=$(date -d "$EXPIRY_DATE" +%s)
              CURRENT_EPOCH=$(date +%s)
              
              # Calculate days until expiry
              DAYS_UNTIL_EXPIRY=$(( (EXPIRY_EPOCH - CURRENT_EPOCH) / 86400 ))
              
              echo "Certificate for $DOMAIN expires in $DAYS_UNTIL_EXPIRY days"
              
              # Check if certificate expires in less than 21 days (3 weeks)
              if [ $DAYS_UNTIL_EXPIRY -lt 21 ]; then
                curl -X POST --insecure -H "Content-Type: application/json" -d \
                  '{"message": "SSL Certificate Alert: '"$DOMAIN"' expires in '"$DAYS_UNTIL_EXPIRY"' days ('"$EXPIRY_DATE"')", "number": "'"$SIGNAL_SOURCE_NUMBER"'", "recipients": ["'"$SIGNAL_TARGET_NUMBER"'"]}' \
                  "http://signal/v2/send"
              else
                echo "Certificate is valid for more than 3 weeks"
              fi