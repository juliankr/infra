apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`nc-test.example.com`) || Host(`nc.example.com`) || Host(`nextcloud.example.com`)
    kind: Rule
    services:
    - name: nextcloud
      port: 8080
  tls:
    secretName: cert