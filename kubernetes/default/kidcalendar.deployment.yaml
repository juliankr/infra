apiVersion: apps/v1
kind: Deployment
metadata:
  name: kidcalendar
  namespace: default
  labels:
    app: kidcalendar
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: kidcalendar
  template:
    metadata:
      labels:
        app: kidcalendar
    spec:
      containers:
      - name: kidcalendar
        image: registry.example.com/kidcalendar:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: EVENTS_CONFIG_PATH
          value: "/data/config/events.yaml"
        - name: IMAGES_DIR
          value: "/data/images"
        - name: PORT
          value: "8000"
        volumeMounts:
        - name: kidcalendar
          mountPath: /data
          subPath: kidcalendar
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            memory: "28Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: kidcalendar
        persistentVolumeClaim:
          claimName: sd

