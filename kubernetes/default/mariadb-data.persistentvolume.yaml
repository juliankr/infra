apiVersion: v1
kind: PersistentVolume
metadata:
  name: mariadb-data
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 50Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    path: /mnt/ssd/mariadb/data
    server: 192.168.0.54
  claimRef:
    name: storage-mariadb-0
    namespace: default
