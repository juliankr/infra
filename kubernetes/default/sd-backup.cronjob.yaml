apiVersion: batch/v1
kind: CronJob
metadata:
  name: sd-backup
  namespace: default
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          initContainers:
          - name: mount-fritzbox
            image: alpine:3.23
            securityContext:
              privileged: true
            command: ["/bin/sh"]
            args:
            - -c
            - |-
              apk add --no-cache cifs-utils curl
              mkdir -p /backup
              if ! mount -t cifs //192.168.0.1/FRITZ.NAS/backup /backup \
                -o username=${FRITZ_USERNAME},password=${FRITZ_PASSWORD},uid=0,gid=0,vers=3.0; then
                curl -s -X POST -H "Content-Type: application/json" -d \
                  '{"message": "Backup FAILED: Could not mount Fritz!Box – is the disk plugged in?", "number": "'"$SIGNAL_SOURCE_NUMBER"'", "recipients": ["'"$SIGNAL_TARGET_NUMBER"'"]}' \
                  "http://signal/v2/send" || true
                exit 1
              fi
            env:
            - name: FRITZ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backup
                  key: username
            - name: FRITZ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backup
                  key: password
            volumeMounts:
            - name: backup
              mountPath: /backup
              mountPropagation: Bidirectional
          containers:
          - name: restic
            image: restic/restic:0.18.1
            command: ["/bin/sh"]
            args:
            - -c
            - |-
              set -e
              TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

              curl -s -X POST -H "Content-Type: application/json" -d \
                '{"message": "'"[$TIMESTAMP]"' Backup started", "number": "'"$SIGNAL_SOURCE_NUMBER"'", "recipients": ["'"$SIGNAL_TARGET_NUMBER"'"]}' \
                "http://signal/v2/send" || true

              export RESTIC_REPOSITORY=/backup/restic
              export RESTIC_PASSWORD=${RESTIC_PASSWORD}

              # Initialize repository if it does not exist yet
              restic snapshots &>/dev/null || restic init

              restic backup /data

              # Keep 7 daily, 4 weekly, 6 monthly snapshots
              restic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune

              curl -s -X POST -H "Content-Type: application/json" -d \
                '{"message": "'"[$TIMESTAMP]"' Backup finished successfully", "number": "'"$SIGNAL_SOURCE_NUMBER"'", "recipients": ["'"$SIGNAL_TARGET_NUMBER"'"]}' \
                "http://signal/v2/send" || true
            env:
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backup
                  key: password
            envFrom:
            - secretRef:
                name: signal
            volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: backup
              mountPath: /backup
              mountPropagation: HostToContainer
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: sd
          - name: backup
            emptyDir: {}
