apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishlist
  namespace: default
  labels:
    app: wishlist
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: wishlist
  template:
    metadata:
      labels:
        app: wishlist
    spec:
      containers:
      - name: wishlist
        image: registry.example.com/wishlist:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: WISHLIST_DATA_FOLDER
          value: "/data/config"
        - name: WISHLIST_IMAGES_FOLDER
          value: "/data/images"
        - name: PORT
          value: "5000"
        volumeMounts:
        - name: wishlist
          mountPath: /data
          subPath: wishlist
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            memory: "28Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: wishlist
        persistentVolumeClaim:
          claimName: sd

