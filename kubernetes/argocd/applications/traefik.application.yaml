apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  destination:
    namespace: traefik
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: traefik
    helm:
      values: |-
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 256Mi
        logs:
          access:
            enabled: true
        service:
          spec:
            externalTrafficPolicy: Local
    repoURL: https://traefik.github.io/charts
    targetRevision: 40.2.0
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - PruneLast=true
