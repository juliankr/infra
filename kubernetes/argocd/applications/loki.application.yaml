apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: loki-stack
    helm:
      values: |-
        promtail:
          revisionHistoryLimit: 0
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 128Mi
        loki:
          image:
            tag: 2.9.3
          revisionHistoryLimit: 0
          auth_enabled: false
          commonConfig:
            replication_factor: 1
            ring:
              kvstore:
                store: inmemory
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 256Mi
          # Setting up schemaConfig for better performance
          schemaConfig:
            configs:
              - from: "2025-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 168h
          
          # Storage configuration
          storage:
            type: filesystem
          
          
          # Pattern ingester for better performance
          pattern_ingester:
            enabled: true
          
          # Configure limits for stability
          limits_config:
            ingestion_rate_mb: 8
            ingestion_burst_size_mb: 16
            max_global_streams_per_user: 5000
            reject_old_samples: true
            reject_old_samples_max_age: 672h
            retention_period: 672h# 7 days retention
            allow_structured_metadata: true
            volume_enabled: true
          
          # Persistence configuration
          persistence:
            enabled: true
            size: 20Gi
            storageClassName: nfs

        # Explicitly set the deployment mode
        deploymentMode: SingleBinary

        # Configure single binary mode
        singleBinary:
          replicas: 1

        # Explicitly set other deployment modes to zero replicas
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0

        # Disable other components since we're using fluent-bit

        grafana:
          enabled: false

        prometheus:
          enabled: false

        # Security context for better security
        securityContext:
          fsGroup: 10001
          runAsUser: 10001
          runAsGroup: 10001

        canary:
          enabled: false

        gateway:
          enabled: false

        results_cache:
          enabled: false

        chunks_cache:
          enabled: false

        memcached:
          enabled: false

        memberlist:
          service:
            enabled: false
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 2.10.2
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - PruneLast=true
