apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 7.0.0
    helm:
      values: |-
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          limits_config:
            volume_enabled: true
            retention_period: 168h
          # Add schema configuration
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          # Configure filesystem storage
          storage:
            type: filesystem
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 20Gi
            storageClass: nfs
        # Explicitly disable scalable modes
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        # Disable MinIO because we use filesystem
        minio:
          enabled: false
        # Disable tests
        test:
          enabled: false
        # Disable all additional components for a true Single Binary deployment
        gateway:
          enabled: false
        lokiCanary:
          enabled: false
        resultsCache:
          enabled: false
        chunksCache:
          enabled: false
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - PruneLast=true
