apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: grafana
    helm:
      values: |-
        persistence:
          enabled: true
          existingClaim: grafana
        revisionHistoryLimit: 0
        resources:
          limits:
            memory: 512Mi
          requests:
            memory: 512Mi
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
            - name: Prometheus
              type: prometheus
              url: http://prometheus-server:80
              access: proxy
              isDefault: true
              jsonData:
                timeInterval: 1m
            - name: Loki
              type: loki
              url: http://loki:3100
              access: proxy
              jsonData:
                maxLines: 1000

    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 10.5.15
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - PruneLast=true
    - RespectIgnoreDifferences=true
  ignoreDifferences:
  - kind: Secret
    name: grafana
    jsonPointers:
    - /data
  - group: "apps"
    kind: Deployment
    name: grafana
    jsonPointers:
    - /spec/template/metadata/annotations/checksum~1secret
