services:
  wishlist:
    build: ..
    ports:
      - "5001:5000"
    volumes:
      # Use existing test folders for data and images
      - ./config:/app/data
      - ./images:/app/images
    environment:
      - WISHLIST_DATA_FOLDER=/app/data
      - WISHLIST_IMAGES_FOLDER=/app/images
    # No restart policy for testing - container stops when it fails
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s