<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist</title>
  
  <!-- PWA Meta Tags -->
  <meta name="description" content="Kid's wishlist app with drag-and-drop reordering">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Wishlist">
  
  <!-- App Icons -->
  <link rel="apple-touch-icon" sizes="256x256" href="/icon_256x256.png">
  <link rel="apple-touch-icon" sizes="128x128" href="/icon_128x128.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/icon_48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon_32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icon_16x16.png">
  <link rel="manifest" href="/manifest.json">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One:wght@400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    
    #app {
      min-height: 100vh;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
